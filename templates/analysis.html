{% extends "layout.html" %}

{% block title %}
Dataset Analysis
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h2>📊 Dataset Summary</h2>
        </div>

        <div class="card-body">

            <p class="summary-text">
    Statistical summary of your uploaded dataset.
</p>

            <div class="table-responsive">
                {{ summary | safe }}
            </div>

            <hr>

            <a href="{{ url_for('upload.upload') }}" class="btn btn-success">
                📂 Upload Another Dataset
            </a>

            <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary">
    🏠 Dashboard
</a>

        </div>

    </div>

</div>

{% endblock %}

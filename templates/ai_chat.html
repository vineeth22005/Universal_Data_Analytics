{% extends "layout.html" %}

{% block title %}
AI Chat
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>🤖 Universal AI Assistant</h2>

    <div class="card shadow">

        <div class="card-body">

            <form method="POST">

                <textarea
                    name="question"
                    class="form-control"
                    rows="4"
                    placeholder="Ask anything... (Example: What is Flask?, Explain SQL JOIN, Tell me about Machine Learning)"
                    required
                ></textarea>

                <button
                    class="btn btn-primary mt-3"
                    type="submit">

                    Send Message

                </button>

            </form>

            <hr>

            <h4>AI Response</h4>

            {% if response %}

            <div class="alert alert-success">

                {{ response }}

            </div>

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
